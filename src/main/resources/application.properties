# Pesquisa por foto: o serviço aceita fotos de até 5 MB; o limite do Spring fica um pouco acima
# para que fotos maiores cheguem ao tratador de erros com uma mensagem clara.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Na nuvem o provedor informa a porta em PORT; no computador, 8080.
server.port=${PORT:8080}
# poucas threads bastam para o uso do projeto e economizam memória na nuvem
server.tomcat.threads.max=20

# Banco do histórico de preços. Sem configuração usa um H2 em arquivo (pasta "dados"), que
# continua existindo entre execuções. Na nuvem, SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME
# e SPRING_DATASOURCE_PASSWORD apontam para o PostgreSQL e substituem estes valores.
spring.datasource.url=jdbc:h2:file:./dados/chorameliga
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=3
# cria a tabela (schema.sql) se ainda não existir, em qualquer banco
spring.sql.init.mode=always
